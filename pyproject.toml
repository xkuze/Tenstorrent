[project]
name = "tenstorrent"
version = "0.1.0"
description = "TT-NN project with MNIST and CIFAR-10 models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ttnn>=0.64.5",
    "lightning>=2.5.6",
    "matplotlib>=3.10.7",
    "openpyxl>=3.1.5",
    "optuna>=4.6.0",
    "optuna-integration[pytorch-lightning]>=4.6.0",
    "pandas==2.2.3",
    "ruff>=0.14.5",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "torch>=2.9.1",
    "torchmetrics>=1.8.2",
    "torchvision>=0.24.1",
    "tt-smi>=3.0.39",
    "albumentations>=1.4.0",
    "opencv-python-headless>=4.9.0",
    "tensorboard>=2.15.0",
    "ttnn-visualizer>=0.67.2",
    "git-filter-repo>=2.47.0",
    "pytest>=9.0.2",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    "generated/tracer/codegen/",  # Auto-generated skeleton code from tracer
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E402",  # Module level import not at top of file (needed for sys.path manipulation)
]
